<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a44"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="مالي"><title>مالي - إدارة مالياتي</title><meta name="application-name" content="مالي"><meta name="mali-version" content="4.1">
<style>
:root{--bg:#f3f6f4;--cd:#fff;--tx:#14201b;--mu:#6b7a73;--pr:#0f7a5c;--rd:#d64545;--gn:#1a9d6b;--bd:#e2e9e5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1411;--cd:#17211d;--tx:#e8f0ec;--mu:#8fa39a;--pr:#2bb98c;--bd:#263630}}
:root[data-theme=dark]{--bg:#0d1411;--cd:#17211d;--tx:#e8f0ec;--mu:#8fa39a;--pr:#2bb98c;--bd:#263630}
html,body{height:100%;margin:0}*{box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:15px}
#m{padding:14px 14px 96px;max-width:560px;margin:auto}
h3{margin:0 0 12px}h4{margin:18px 0 8px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.hero{background:var(--pr);color:#fff;border:0}.hero small{opacity:.85}.big{font-size:30px;font-weight:700;margin:4px 0}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.g3 small{display:block;color:var(--mu)}
.hero .g3 small{color:#fff;opacity:.85}
small{color:var(--mu);font-size:12px}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--bd);gap:8px}.row:last-child{border:0}
.row div small{display:block}
.i{color:var(--gn);font-weight:600}.e{color:var(--rd);font-weight:600}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--cd);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:10px 0;font:inherit;font-size:12px}
nav button.on{color:var(--pr);font-weight:700}nav span{display:block;font-size:20px}
.fab{position:fixed;bottom:calc(66px + env(safe-area-inset-bottom,0px));left:16px;width:56px;height:56px;border-radius:50%;background:var(--pr);color:#fff;border:0;font-size:30px;box-shadow:0 4px 14px #0004}
input,select{width:100%;padding:12px;margin:5px 0;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit}
.pb,.sb{width:100%;padding:13px;border:0;border-radius:12px;background:var(--pr);color:#fff;font:inherit;font-weight:700;margin-top:8px}
.sb{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}.dg{background:var(--rd);color:#fff}
.seg{display:flex;gap:6px;margin-bottom:8px}.seg button{flex:1;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}.seg .on{background:var(--pr);color:#fff;border-color:var(--pr)}
#sh{display:none;position:fixed;inset:0;z-index:5}.bk{position:absolute;inset:0;background:#0008}
.sh{position:absolute;bottom:0;left:0;right:0;max-height:88%;overflow:auto;background:var(--cd);border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));max-width:560px;margin:auto}
.bar{height:9px;background:var(--bd);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--pr)}.bar i.o{background:var(--rd)}
.ms{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.ms button{background:var(--cd);border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:8px 16px;font-size:16px}
.don{width:150px;height:150px;border-radius:50%;margin:8px auto}.don div{}
.lg{display:flex;align-items:center;gap:8px;padding:4px 0}.lg i{width:11px;height:11px;border-radius:3px}
.cols{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:8px}.cols div{flex:1;text-align:center}.cols span{display:flex;gap:2px;align-items:flex-end;height:96px;justify-content:center}.cols b{width:10px;border-radius:4px 4px 0 0;display:block}
.al{background:#f5a62333;border:1px solid #f5a623;border-radius:12px;padding:10px;margin-bottom:12px;font-size:13px}
#lk{display:none;position:fixed;inset:0;background:var(--bg);z-index:9;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#lk input{width:180px;text-align:center;font-size:28px;letter-spacing:10px}
textarea{width:100%;height:120px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:8px}
</style></head><body>
<div id="m"></div><button class="fab" onclick="tf()">+</button>
<nav id="nv"></nav><div id="sh"></div>
<div id="lk"><div style="font-size:44px">🔒</div><b>أدخل الرمز السري</b><input id="pi" type="password" inputmode="numeric" maxlength="4" oninput="pc()"><small id="pe"></small></div>
<script>
const $=s=>document.querySelector(s),K='mali_v1',CE=['أكل وشرب','مواصلات','فواتير','إيجار','صحة','تعليم','ترفيه','ملابس','ادخار','أخرى'],CI=['راتب','عمل حر','هدية','أخرى'],PL=['#0f7a5c','#e0a800','#d64545','#3b82f6','#8b5cf6','#ec4899','#14b8a6','#f97316','#64748b','#a3a3a3'];
let S,tab='home',mo=(()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')})(),cbk=null;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{name:'',pin:'',w:[],tx:[],bud:{},debts:[],theme:'',bk:0};
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}},uid=()=>Math.random().toString(36).slice(2,9),ld=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),td=()=>ld(new Date());
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f=n=>Number(n||0).toLocaleString('ar-EG',{maximumFractionDigits:2})+' ج.م';
const txm=m=>S.tx.filter(x=>x.d.startsWith(m)),sm=(l,t)=>l.filter(x=>x.t==t).reduce((s,x)=>s+x.a,0);
const wn=id=>(S.w.find(w=>w.id==id)||{n:'؟'}).n;
const bal=w=>S.tx.reduce((s,x)=>x.t=='i'&&x.w==w.id?s+x.a:x.t=='e'&&x.w==w.id?s-x.a:x.t=='t'?(x.w==w.id?s-x.a:x.w2==w.id?s+x.a:s):s,w.b);
const mname=m=>new Date(+m.slice(0,4),+m.slice(5)-1,1).toLocaleDateString('ar-EG',{month:'long',year:'numeric'});
const shm=(m,d)=>{const t=new Date(+m.slice(0,4),+m.slice(5)-1+d,1);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')};
const wo=()=>S.w.map(w=>`<option value="${w.id}">${esc(w.n)}</option>`).join('');
const msw=()=>`<div class=ms><button onclick="mo=shm(mo,-1);R()">›</button><b>${mname(mo)}</b><button onclick="mo=shm(mo,1);R()">‹</button></div>`;
function sheet(h){$('#sh').innerHTML=`<div class=bk onclick="cl()"></div><div class=sh>${h}</div>`;$('#sh').style.display='block'}
const cl=()=>{$('#sh').style.display='none'};
function ask(msg,fn){cbk=fn;sheet(`<h3>${msg}</h3><button class="pb dg" onclick="cl();cbk()">نعم، متأكد</button><button class=sb onclick="cl()">إلغاء</button>`)}
const setTheme=t=>{S.theme=t;t?document.documentElement.dataset.theme=t:delete document.documentElement.dataset.theme;sv()};
setTheme(S.theme);

function home(){
 const tot=S.w.reduce((s,w)=>s+bal(w),0),l=txm(td().slice(0,7)),inc=sm(l,'i'),ex=sm(l,'e');
 const bt=Object.values(S.bud).reduce((a,b)=>a+b,0),bs=l.filter(x=>x.t=='e'&&S.bud[x.c]).reduce((s,x)=>s+x.a,0);
 const due=S.debts.filter(d=>!d.p&&d.due).sort((a,b)=>a.due>b.due?1:-1).slice(0,3);
 return `${Date.now()-S.bk>7*864e5?'<div class=al>⏰ مر أكثر من أسبوع على آخر نسخة احتياطية. من "المزيد" احفظ نسخة من بياناتك.</div>':''}
 <div class="c hero"><small>أهلاً ${esc(S.name)} 👋 · إجمالي رصيدك</small><div class=big>${f(tot)}</div>
 <div class=g3><div><small>دخل الشهر</small>${f(inc)}</div><div><small>مصروف الشهر</small>${f(ex)}</div><div><small>الصافي</small>${f(inc-ex)}</div></div></div>
 ${bt?`<div class=c><b>الميزانية الشهرية</b><div class=bar><i class="${bs>bt?'o':''}" style="width:${Math.min(100,bs/bt*100)}%"></i></div><small>${bs>bt?'تجاوزت الميزانية بـ '+f(bs-bt):'المتبقي '+f(bt-bs)+' من '+f(bt)}</small></div>`:''}
 <div class=c><b>محافظي</b>${S.w.map(w=>`<div class=row><span>${esc(w.n)}</span><b>${f(bal(w))}</b></div>`).join('')}</div>
 ${due.length?`<div class=c><b>ديون قادمة</b>${due.map(d=>`<div class=row><div>${esc(d.who)}<small>${d.dir=='on'?'عليا':'ليا'} · ${d.due}</small></div><b>${f(d.a)}</b></div>`).join('')}</div>`:''}
 <div class=c><b>آخر العمليات</b>${rows([...S.tx].sort((a,b)=>b.d>a.d?1:-1).slice(0,5))}</div>`}
function rows(l){return l.length?l.map(x=>`<div class=row onclick="dt('${x.id}')"><div><b>${x.t=='t'?'تحويل':esc(x.c)}</b><small>${x.t=='t'?esc(wn(x.w))+' ← '+esc(wn(x.w2)):esc(wn(x.w))} · ${x.d}${x.n?' · '+esc(x.n):''}</small></div><span class="${x.t=='i'?'i':x.t=='e'?'e':''}">${x.t=='i'?'+':x.t=='e'?'-':''}${f(x.a)}</span></div>`).join(''):'<small>لا توجد عمليات</small>'}
function txv(){const l=txm(mo).sort((a,b)=>b.d>a.d?1:-1);return msw()+`<div class=c>${rows(l)}</div><small>اضغط على أي عملية لحذفها</small>`}
function bud(){const l=txm(mo);return msw()+`<div class=c><small>حدد حداً شهرياً لكل تصنيف واضغط عليه للتعديل</small>`+CE.map(c=>{const s=l.filter(x=>x.t=='e'&&x.c==c).reduce((a,x)=>a+x.a,0),b=S.bud[c]||0;return `<div style="padding:8px 0" onclick="bf('${c}')"><div class=row style="border:0;padding:0"><b>${c}</b><small>${f(s)}${b?' / '+f(b):' · بدون حد'}</small></div>${b?`<div class=bar><i class="${s>b?'o':''}" style="width:${Math.min(100,s/b*100)}%"></i></div>${s>b*.9?`<small class=e>${s>b?'تجاوزت الحد!':'اقتربت من الحد'}</small>`:''}`:''}</div>`}).join('')+'</div>'}
function rep(){
 const l=txm(mo).filter(x=>x.t=='e'),tot=sm(l,'e'),by=CE.map((c,i)=>({c,v:l.filter(x=>x.c==c).reduce((a,x)=>a+x.a,0),k:PL[i]})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
 let a=0,g=by.map(x=>{const s=a;a+=x.v/tot*100;return `${x.k} ${s}% ${a}%`}).join(',');
 const ms=[5,4,3,2,1,0].map(i=>shm(td().slice(0,7),-i)).map(m=>({m,i:sm(txm(m),'i'),e:sm(txm(m),'e')})),mx=Math.max(1,...ms.flatMap(x=>[x.i,x.e]));
 return msw()+`<div class=c><b>المصروفات حسب التصنيف</b>${tot?`<div class=don style="background:conic-gradient(${g})"></div>${by.map(x=>`<div class=lg><i style="background:${x.k}"></i>${x.c}<span style="margin-inline-start:auto">${f(x.v)} (${Math.round(x.v/tot*100)}%)</span></div>`).join('')}`:'<br><small>لا توجد مصروفات في هذا الشهر</small>'}</div>
 <div class=c><b>آخر 6 شهور</b> <small>(أخضر دخل · أحمر مصروف)</small><div class=cols>${ms.map(x=>`<div><span><b style="background:var(--gn);height:${x.i/mx*100}%"></b><b style="background:var(--rd);height:${x.e/mx*100}%"></b></span><small>${+x.m.slice(5)}</small></div>`).join('')}</div></div>`}
function more(){return `<div class=c><b>المحافظ</b>${S.w.map(w=>`<div class=row onclick="wf('${w.id}')"><span>${esc(w.n)}</span><b>${f(bal(w))}</b></div>`).join('')}<button class=sb onclick="wf()">+ إضافة محفظة</button></div>
 <div class=c><b>الديون والسلف</b>${S.debts.map(d=>`<div class=row onclick="df('${d.id}')"><div><span style="${d.p?'text-decoration:line-through':''}">${esc(d.who)}</span><small>${d.dir=='on'?'عليّ':'له عندي'}${d.due?' · '+d.due:''}${d.p?' · تم السداد':''}</small></div><b class="${d.dir=='on'?'e':'i'}">${f(d.a)}</b></div>`).join('')||'<small>لا توجد ديون</small>'}<button class=sb onclick="df()">+ دين أو سلفة</button></div>
 <div class=c><b>الإعدادات</b><button class=sb onclick="bkp()">نسخ احتياطي / استعادة</button><button class=sb onclick="pf()">${S.pin?'تغيير':'تفعيل'} الرمز السري</button><button class=sb onclick="setTheme(S.theme=='dark'?'light':'dark');R()">تبديل الوضع الداكن / الفاتح</button><button class="sb e" onclick="ask('مسح كل البيانات نهائياً؟',()=>{S=null;try{localStorage.removeItem(K)}catch(e){}location.reload()})">مسح كل البيانات</button></div>`}
function R(){$('#m').innerHTML={home,tx:txv,bud,rep,more}[tab]();$('#nv').innerHTML=[['home','🏠','الرئيسية'],['tx','🔎','العمليات'],['bud','🎯','الميزانية'],['rep','📊','التقارير'],['more','⚙️','المزيد']].map(([k,i,l])=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';R();scrollTo(0,0)"><span>${i}</span>${l}</button>`).join('')}
function tf(t='e'){if(!S.w.length)return;const cs=t=='i'?CI:CE;sheet(`<h3>عملية جديدة</h3><div class=seg>${[['e','مصروف'],['i','دخل'],['t','تحويل']].map(([k,l])=>`<button class="${k==t?'on':''}" onclick="tf('${k}')">${l}</button>`).join('')}</div><input id=a type=number inputmode=decimal placeholder="المبلغ">${t!='t'?`<select id=c>${cs.map(c=>`<option>${c}</option>`).join('')}</select>`:''}<select id=w>${wo()}</select>${t=='t'?`<select id=w2>${wo()}</select>`:''}<input id=d type=date value="${td()}"><input id=n placeholder="ملاحظة (اختياري)"><button class=pb onclick="stx('${t}')">حفظ</button>`)}
function stx(t){const a=parseFloat($('#a').value);if(!(a>0))return $('#a').focus();const x={id:uid(),t,a,w:$('#w').value,d:$('#d').value||td(),n:$('#n').value};if(t=='t'){x.w2=$('#w2').value;if(x.w==x.w2)return}else x.c=$('#c').value;S.tx.push(x);sv();cl();R()}
const dt=id=>ask('حذف هذه العملية؟',()=>{S.tx=S.tx.filter(x=>x.id!=id);sv();R()});
function bf(c){sheet(`<h3>ميزانية ${c}</h3><input id=a type=number inputmode=decimal value="${S.bud[c]||''}" placeholder="الحد الشهري (اتركه فارغاً للإلغاء)"><button class=pb onclick="S.bud['${c}']=parseFloat($('#a').value)||0;if(!S.bud['${c}'])delete S.bud['${c}'];sv();cl();R()">حفظ</button>`)}
function wf(id){const w=S.w.find(x=>x.id==id)||{n:'',b:0};sheet(`<h3>${id?'تعديل':'إضافة'} محفظة</h3><input id=n value="${esc(w.n)}" placeholder="الاسم (كاش، بنك، فودافون كاش...)"><input id=a type=number inputmode=decimal value="${w.b}" placeholder="الرصيد الافتتاحي"><button class=pb onclick="swf('${id||''}')">حفظ</button>${id?`<button class="sb e" onclick="ask('حذف المحفظة؟ ستُحذف عملياتها أيضاً.',()=>{S.w=S.w.filter(x=>x.id!='${id}');S.tx=S.tx.filter(x=>x.w!='${id}'&&x.w2!='${id}');sv();R()})">حذف</button>`:''}`)}
function swf(id){const n=$('#n').value.trim(),b=parseFloat($('#a').value)||0;if(!n)return;if(id){const w=S.w.find(x=>x.id==id);w.n=n;w.b=b}else S.w.push({id:uid(),n,b});sv();cl();R()}
function df(id){const d=S.debts.find(x=>x.id==id)||{who:'',a:'',dir:'on',due:''};sheet(`<h3>دين / سلفة</h3><input id=n value="${esc(d.who)}" placeholder="اسم الشخص"><input id=a type=number inputmode=decimal value="${d.a}" placeholder="المبلغ"><select id=c><option value=on ${d.dir=='on'?'selected':''}>عليّ (أنا مدين)</option><option value=for ${d.dir=='for'?'selected':''}>له عندي / ليا عنده</option></select><input id=d type=date value="${d.due||''}"><button class=pb onclick="sdf('${id||''}')">حفظ</button>${id?`<button class=sb onclick="S.debts.find(x=>x.id=='${id}').p=!${!!d.p};sv();cl();R()">${d.p?'إلغاء السداد':'تم السداد ✓'}</button><button class="sb e" onclick="S.debts=S.debts.filter(x=>x.id!='${id}');sv();cl();R()">حذف</button>`:''}`)}
function sdf(id){const who=$('#n').value.trim(),a=parseFloat($('#a').value);if(!who||!(a>0))return;const o={who,a,dir:$('#c').value,due:$('#d').value};if(id)Object.assign(S.debts.find(x=>x.id==id),o);else S.debts.push({id:uid(),...o});sv();cl();R()}
function bkp(){const j=JSON.stringify(S);sheet(`<h3>نسخة احتياطية</h3><small>انسخ النص وابعته لنفسك على واتساب. للاستعادة الصق النص هنا واضغط استعادة.</small><textarea id=t>${esc(j)}</textarea><button class=pb onclick="$('#t').select();try{navigator.clipboard.writeText($('#t').value)}catch(e){document.execCommand('copy')};S.bk=Date.now();sv();this.textContent='تم النسخ ✓'">نسخ</button><button class=sb onclick="rs()">استعادة من النص الملصوق</button>`)}
function rs(){try{const o=JSON.parse($('#t').value);if(!o.w||!o.tx)throw 0;S=o;sv();cl();R()}catch(e){alert('النص غير صالح')}}
function pf(){sheet(`<h3>الرمز السري</h3><input id=a type=password inputmode=numeric maxlength=4 placeholder="4 أرقام (فارغ لإلغاء القفل)"><button class=pb onclick="S.pin=/^\\d{4}$/.test($('#a').value)?$('#a').value:'';sv();cl();R()">حفظ</button>`)}
function pc(){if($('#pi').value==S.pin){$('#lk').style.display='none';$('#pi').value=''}else if($('#pi').value.length>=4){$('#pe').textContent='رمز غير صحيح';$('#pi').value=''}}
function setup(){sheet(`<h3>أهلاً بك في مالي 👋</h3><input id=n placeholder="اسمك"><input id=a type=number inputmode=decimal placeholder="الرصيد الحالي كاش"><input id=b type=number inputmode=decimal placeholder="الرصيد الحالي في البنك"><input id=p type=password inputmode=numeric maxlength=4 placeholder="رمز سري 4 أرقام (اختياري)"><button class=pb onclick="fin()">ابدأ</button>`);$('.bk').onclick=null}
function fin(){S.name=$('#n').value.trim()||'صديقي';S.w=[{id:uid(),n:'كاش',b:parseFloat($('#a').value)||0},{id:uid(),n:'البنك',b:parseFloat($('#b').value)||0}];if(/^\d{4}$/.test($('#p').value))S.pin=$('#p').value;sv();cl();R()}
R();if(S.pin)$('#lk').style.display='flex';if(!S.w.length)setup();

function bkp(){const j=JSON.stringify(S);sheet(`<h3>نسخة احتياطية</h3><button class=pb onclick="dl()">⬇️ حفظ ملف نسخة احتياطية</button><label class=sb style="display:block;text-align:center;padding:13px;margin-top:8px;border-radius:12px">📂 استعادة من ملف<input type=file accept=".json,application/json" onchange="fi(this)" style="display:none"></label><small>أو انسخ النص وابعته لنفسك:</small><textarea id=t>${esc(j)}</textarea><button class=sb onclick="$('#t').select();try{navigator.clipboard.writeText($('#t').value)}catch(e){document.execCommand('copy')};S.bk=Date.now();sv();this.textContent='تم النسخ ✓'">نسخ النص</button><button class=sb onclick="rs()">استعادة من النص الملصوق</button>`)}

<script>
/* Mali v4.1 stability patch — keeps the same localStorage key (mali_v1) and local-first model. */
function fix(){
  S=S||{};
  S.name=S.name||''; S.pin=S.pin||''; S.theme=S.theme||''; S.bk=Number(S.bk)||0;
  S.w=Array.isArray(S.w)?S.w:[]; S.tx=Array.isArray(S.tx)?S.tx:[];
  S.bud=S.bud&&typeof S.bud==='object'?S.bud:{};
  S.ppl=Array.isArray(S.ppl)?S.ppl:[]; S.goals=Array.isArray(S.goals)?S.goals:[];
  S.bills=Array.isArray(S.bills)?S.bills:[]; S.gm=Array.isArray(S.gm)?S.gm:[];
  S.nt=S.nt&&typeof S.nt==='object'?S.nt:{};
  if(!Array.isArray(S.ce)||!S.ce.length)S.ce=['أكل وشرب','مواصلات','فواتير','إيجار','صحة','تعليم','ترفيه','ملابس','ادخار','أخرى'];
  if(!Array.isArray(S.ci)||!S.ci.length)S.ci=['راتب','عمل حر','هدية','أخرى'];
  S.ppl.forEach(p=>{p.e=Array.isArray(p.e)?p.e:[];p.ph=p.ph||'';p.due=p.due||''});
  S.bills.forEach(b=>{b.ty=b.ty==='i'?'i':'e';b.day=Math.min(31,Math.max(1,parseInt(b.day)||1));if(!b.c)b.c=b.ty==='i'?S.ci[0]:(S.ce.includes('فواتير')?'فواتير':S.ce[0])});
  S.gm.forEach(g=>{g.paid=g.paid&&typeof g.paid==='object'?g.paid:{};g.got=g.got||0});
  if(Array.isArray(S.debts)&&S.debts.length){
    S.debts.forEach(d=>{if(d.p)return;let p=S.ppl.find(x=>x.n==d.who);if(!p)S.ppl.push(p={id:uid(),n:d.who||'شخص',ph:'',due:d.due||'',e:[]});p.e.push({id:uid(),a:d.dir=='on'?-Number(d.a||0):Number(d.a||0),d:td(),tm:nt(),n:'دين سابق',ts:Date.now()})});
    S.debts=[];
  }
  CE.length=0;CE.push(...S.ce);CI.length=0;CI.push(...S.ci);
  while(PL.length<CE.length)PL.push('hsl('+(PL.length*47%360)+',55%,50%)');
}

function txe(id){const x=S.tx.find(y=>y.id==id);if(!x)return;const t=x.t,cs=t=='i'?CI:CE,W=S.w.map(w=>[w.id,w.n]);fm('تعديل العملية',[['a','number','المبلغ',x.a],...(t!='t'?[['c','select','التصنيف',x.c,(cs.includes(x.c)?cs:[...cs,x.c]).map(c=>[c,c])]]:[]),['w','select',t=='t'?'من محفظة':'المحفظة',x.w,W],...(t=='t'?[['w2','select','إلى محفظة',x.w2,W]]:[]),['d','date','التاريخ',x.d],['tm','time','الوقت',x.tm||''],['n','text','ملاحظة',x.n||'']],()=>{const a=parseFloat(V('a'));if(!(a>0))return;if(t=='t'&&V('w')==V('w2')){alert('اختار محفظتين مختلفتين للتحويل.');return}Object.assign(x,{a,w:V('w'),d:V('d')||x.d,tm:V('tm'),n:V('n')});if(t=='t')x.w2=V('w2');else x.c=V('c');sv();cl();R()},`<button class="sb e" onclick="ask('حذف العملية؟',()=>{S.tx=S.tx.filter(y=>y.id!='${id}');sv();cl();R()})">حذف العملية</button>`)}

function wf(id){const w=S.w.find(x=>x.id==id)||{n:'',b:0};let extra='';if(id){const txc=S.tx.filter(x=>x.w==id||x.w2==id).length,bc=S.bills.filter(x=>x.w==id).length,gc=S.gm.filter(x=>x.w==id).length,refs=txc+bc+gc;if(S.w.length<=1)extra='<small style="display:block;margin-top:10px">لا يمكن حذف آخر محفظة.</small>';else if(refs)extra=`<small style="display:block;margin-top:10px">لحماية تاريخك المالي، لا يمكن حذف المحفظة لأنها مرتبطة بـ ${txc} عملية${bc?` و${bc} بند متكرر`:''}${gc?` و${gc} جمعية`:''}. تقدر تغيّر اسمها أو رصيدها الافتتاحي بدل الحذف.</small>`;else extra=`<button class="sb e" onclick="ask('حذف المحفظة؟',()=>{S.w=S.w.filter(x=>x.id!='${id}');sv();cl();R()})">حذف المحفظة</button>`}sheet(`<h3>${id?'تعديل':'إضافة'} محفظة</h3><input id=n value="${esc(w.n)}" placeholder="الاسم (كاش، بنك، فودافون كاش...)"><input id=a type=number inputmode=decimal value="${w.b}" placeholder="الرصيد الافتتاحي"><button class=pb onclick="swf('${id||''}')">حفظ</button>${extra}`)}
